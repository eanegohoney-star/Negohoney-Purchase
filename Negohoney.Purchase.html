/* ── GOOGLE SHEETS API ── */
async function gsFetch(params){
  try{
    const url=API_URL+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)).join('&');
    const r=await fetch(url);
    return await r.json();
  }catch(e){return {ok:false,error:e.message};}
}
async function gsGet(sheet){const r=await gsFetch({action:'getAll',sheet});return r.ok?r.rows:null;}
async function gsSave(sheet,data){
  // serialize items array
  const d={...data};
  if(d.items&&typeof d.items==='object')d.items=JSON.stringify(d.items);
  return gsFetch({action:'save',sheet,data:JSON.stringify(d)});
}
async function gsDel(sheet,id){return gsFetch({action:'delete',sheet,id});}
function parseRows(rows){

    const o={...r};

    +'<h1>בקשה להצעת מחיר</h1><div class="sub">Negohoney / דבש נגוהות — נגוהות ד.נ לכיש | 079-6079078 | negohoney1@gmail.com</div>'
    +'<div class="boxes"><div class="box"><strong>לכבוד: '+(s.name||req.supplierName||'—')+'</strong>'+(s.phone?'<br>טלפון: '+s.phone:'')+( s.email?'<br>מייל: '+s.email:'')+'</div><div class="box"><strong>תאריך: '+fmtD(req.date)+'</strong><br>נושא: '+(req.subject||'—')+'<br>תאריך אספקה מבוקש: '+fmtD(req.delivDate)+'</div></div>'
    +'<table><thead><tr><th style="width:4%">מס\'</th><th>תיאור מוצר</th><th style="width:10%">מק"ט</th><th style="width:8%">כמות</th><th style="width:8%">יחידה</th><th style="width:14%">מחיר יחידה ₪</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +(req.notes?'<div class="notes">'+req.notes+'</div>':'')
    +'</body></html>';
  const w=window.open('','_blank','width=900,height=700');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}
}

function PRModule({supp,products,user,code,initItems,clearInit,connected}){
  const[reqs,setReqs]=useState(()=>{
    // try to load from sheets cache first
    const fromSheets=S.g('ng_pr_sheets',null);
    return fromSheets||S.g('ng_pr',[]);
  });
  // also load fresh from sheets if connected
  useEffect(()=>{
    if(!connected)return;
    (async()=>{
      const rows=await gsGet('בקשות רכש');
      if(rows){const l=parseRows(rows);setReqs(l);S.s('ng_pr',l);}
    })();
  },[connected]);
  const[view,setView]=useState('list');
  const[cid,setCid]=useState(null);
  const[appFor,setAppFor]=useState(null);
  const persist=l=>{setReqs(l);S.s('ng_pr',l);};
  const persistPR=async(l,changed,deleted)=>{
    persist(l);
    if(connected){
      if(changed)await gsSave('בקשות רכש',changed);
      if(deleted)await gsDel('בקשות רכש',deleted);
    }
  };

  useEffect(()=>{
    if(initItems&&initItems.length>0){
      const id=Math.max(0,...reqs.map(x=>x.id))+1;
      const r={id,num:null,date:today(),reqBy:user.last+' '+user.first,subject:'',supplierName:'',suppPay:'',
        items:initItems.map(p=>({pid:p.id,sku:p.sku||'',name:p.name,qty:'',unit:"יח'",price:''})),
        urgency:'רגיל',delivDate:'',delivMethod:'כולל משלוח',delivAddr:'נגוהות ד.נ לכיש 7939000',
        notes:'',quoteRef:'',quoteDate:'',status:'בקשת עובד',approvalNote:'',approvedBy:'',approvedDate:''};
      persist([...reqs,r]);setCid(id);setView('form');
      clearInit();
    }
  },[initItems]);

  const newReq=()=>{
    const id=Math.max(0,...reqs.map(x=>x.id))+1;
    const r={id,num:null,date:today(),reqBy:user.last+' '+user.first,subject:'',supplierName:'',suppPay:'',
      items:[{pid:0,sku:'',name:'',qty:'',unit:"יח'",price:''}],urgency:'רגיל',
      delivDate:'',delivMethod:'כולל משלוח',delivAddr:'נגוהות ד.נ לכיש 7939000',
      notes:'',quoteRef:'',quoteDate:'',status:'בקשת עובד',approvalNote:'',approvedBy:'',approvedDate:''};
    persist([...reqs,r]);setCid(id);setView('form');
  };
  const onSave=f=>{const l=reqs.map(x=>x.id===f.id?f:x);persistPR(l,f);};
  const onSubmit=f=>{
    if(!f.num)f.num=nextNum(reqs);
    const isMgr=['מנהל','מנהלת רכש','מנכלית'].includes(user.role);
    const hasPrices=f.items.some(i=>i.price&&parseFloat(i.price)>0);
    if(isMgr&&hasPrices)f.status='ממתינה לאישור';
    else if(isMgr&&f.quoteRef)f.status='הצעת מחיר התקבלה';
    else if(isMgr)f.status='ממתינה להצעה';
    else f.status='בקשת עובד';
    persistPR(reqs.map(x=>x.id===f.id?f:x),f);setView('detail');
  };
  const onApprove=(id,note)=>{const u=reqs.find(x=>x.id===id);const nu={...u,status:'מאושרת',approvalNote:note,approvedBy:user.last+' '+user.first,approvedDate:today()};persistPR(reqs.map(x=>x.id===id?nu:x),nu);};
  const onReject=(id,note)=>{const u=reqs.find(x=>x.id===id);const nu={...u,status:'נדחתה',approvalNote:note,approvedBy:user.last+' '+user.first};persistPR(reqs.map(x=>x.id===id?nu:x),nu);};
  const onIssued=req=>{const nu={...req,status:'הופקה הזמנה'};persistPR(reqs.map(x=>x.id===req.id?nu:x),nu);printPO(req,supp);};
  const cur=reqs.find(x=>x.id===cid);
  return h('div',null,
    appFor&&h(ApprovalModal,{req:appFor,onApprove,onReject,onClose:()=>setAppFor(null),code}),
    view==='form'&&cur?h(PRForm,{req:cur,supp,products,onSave,onSubmit,onBack:()=>setView('list'),user}):
    view==='detail'&&cur?h(PRDetail,{req:cur,user,onBack:()=>setView('list'),onEdit:()=>setView('form'),onApprovalOpen:()=>setAppFor(cur),onIssued,supp}):
    h(PRList,{reqs,onNew:newReq,onView:id=>{setCid(id);setView('detail');},onDelete:id=>{if(id){persistPR(reqs.filter(x=>x.id!==id),null,id);}},user})
  );
}

function SettingsModule({users,setUsers,settings,setSettings,user}){
  const isCEO=user.role==='מנכלית';
  const[cur,sc]=useState('');const[nw,sn]=useState('');const[cf,scf]=useState('');const[msg,sm]=useState('');
  const[eid,se]=useState(null);
  function saveCode(){
    if(cur!==settings.code){sm('קוד נוכחי שגוי');return;}
    if(nw.length<4){sm('קוד חדש — לפחות 4 תווים');return;}
    if(nw!==cf){sm('הקודים אינם תואמים');return;}
    const ns={...settings,code:nw};setSettings(ns);S.s('ng_set',ns);
    sm('הקוד עודכן בהצלחה ✓');sc('');sn('');scf('');
  }
  function updU(id,k,v){const u=users.map(x=>x.id===id?{...x,[k]:v}:x);setUsers(u);S.s('ng_users',u);}
  function addU(){const id=Math.max(...users.map(u=>u.id),0)+1;const u=[...users,{id,last:'',first:'',role:'עובד'}];setUsers(u);S.s('ng_users',u);se(id);}
  function delU(id){if(users.find(u=>u.id===id)?.role==='מנכלית'){alert('לא ניתן למחוק מנכ"לית');return;}const u=users.filter(x=>x.id!==id);setUsers(u);S.s('ng_users',u);}
  return h('div',null,
    h('div',{className:'hdr'},h('div',{style:{fontSize:16,fontWeight:500}},'הגדרות')),
    h('div',{style:{padding:'18px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:11}},
        h('div',{style:{fontSize:15,fontWeight:500}},'משתמשים'),
        isCEO&&h('button',{className:'bp',onClick:addU},'+ הוסף משתמש')
      ),
      h('div',{className:'tw',style:{marginBottom:22}},
        h('table',{style:{tableLayout:'fixed'}},
          h('colgroup',null,h('col',{style:{width:'23%'}}),h('col',{style:{width:'23%'}}),h('col',{style:{width:'20%'}}),h('col',{style:{width:'12%'}}),isCEO&&h('col',{style:{width:'8%'}})),
          h('thead',null,h('tr',null,['שם משפחה','שם פרטי','תפקיד','',''].filter(Boolean).map((hd,i)=>h('th',{key:i},hd)))),
          h('tbody',null,users.map((u,i)=>{
            const isMe=u.id===user.id;const ed=eid===u.id&&isCEO;
            return h('tr',{key:u.id,style:{background:isMe?'#EFF6FF':i%2===0?'#fff':'#F9FAFB'}},
              h('td',null,ed?h('input',{value:u.last,onChange:e=>updU(u.id,'last',e.target.value)}):h('span',{style:{fontWeight:isMe?500:400}},u.last+(isMe?' (אני)':''))),
              h('td',null,ed?h('input',{value:u.first,onChange:e=>updU(u.id,'first',e.target.value)}):u.first),
              h('td',null,ed?h('select',{value:u.role,onChange:e=>updU(u.id,'role',e.target.value)},ROLES.map(r=>h('option',{key:r,value:r},RD[r]||r))):h(RBdg,{r:u.role})),
              h('td',null,isCEO&&(ed?h('button',{className:'bs',style:{fontSize:12,padding:'3px 9px'},onClick:()=>se(null)},'שמור'):h('button',{className:'bsm',onClick:()=>se(u.id)},'ערוך'))),
              isCEO&&h('td',{style:{textAlign:'center'}},!isMe&&h('button',{style:{background:'none',border:'none',cursor:'pointer',color:'var(--gr)',fontSize:14},onClick:()=>delU(u.id)},'🗑'))
            );
          }))
        )
      ),
      isCEO&&h('div',null,
        h('hr',{className:'div'}),
        h('div',{style:{fontSize:15,fontWeight:500,marginBottom:13}},'קוד אישור מנכ"לית'),
        h('div',{style:{maxWidth:320,display:'flex',flexDirection:'column',gap:10}},
          h('div',{className:'fg'},h('label',null,'קוד נוכחי'),h('input',{type:'password',value:cur,onChange:e=>sc(e.target.value)})),
          h('div',{className:'fg'},h('label',null,'קוד חדש'),h('input',{type:'password',value:nw,onChange:e=>sn(e.target.value)})),
          h('div',{className:'fg'},h('label',null,'אישור קוד חדש'),h('input',{type:'password',value:cf,onChange:e=>scf(e.target.value)})),
          msg&&h('div',{style:{fontSize:12,color:msg.includes('✓')?'var(--G)':'var(--R)',background:msg.includes('✓')?'var(--Gl)':'var(--Rl)',padding:'5px 9px',borderRadius:6}},msg),
          h('button',{className:'bp',onClick:saveCode},'עדכן קוד')
        )
      )
    )
  );
}

/* ── ROOT ── */
function App(){
  const[cu,setCu]=useState(()=>S.g('ng_ses',null));
  const[users,setUsers]=useState(()=>S.g('ng_users',DU));
  const[supp,setSupp]=useState(()=>S.g('ng_supp',DSU));
  const[prod,setProd]=useState(()=>S.g('ng_prod',DP));
  const[settings,setSettings]=useState(()=>S.g('ng_set',DS));
  const[tab,setTab]=useState('requests');
  const[prItems,setPrItems]=useState(null);
  const[syncing,setSyncing]=useState(false);
  const[syncMsg,setSyncMsg]=useState('');
  const[connected,setConnected]=useState(null); // null=checking, true, false

  // בדיקת חיבור + טעינת נתונים בסטארט
  useEffect(()=>{
    (async()=>{
      const ping=await gsFetch({action:'ping'});
      if(!ping.ok){setConnected(false);return;}
      setConnected(true);
      // טען נתונים מ-Sheets
      const[su,pr,us,se]=await Promise.all([
        gsGet('ספקים'),gsGet('בקשות רכש'),gsGet('משתמשים'),gsGet('הגדרות')
      ]);
      if(su&&su.length>0){const l=parseRows(su);setSupp(l);S.s('ng_supp',l);}
      if(pr&&pr.length>=0){const l=parseRows(pr);// reqs loaded separately in PRModule
        S.s('ng_pr_sheets',l);}
      if(us&&us.length>0){const l=parseRows(us);setUsers(l);S.s('ng_users',l);}
      if(se&&se.length>0){
        // parse settings key/value pairs
        const obj={...DS};
        se.forEach(r=>{if(r.key)obj[r.key]=r.value;});
        setSettings(obj);S.s('ng_set',obj);
      }
    })();
  },[]);

  if(!cu)return h(Login,{users,onLogin:u=>{setCu(u);S.s('ng_ses',u);}});
  const me=users.find(u=>u.id===cu.id)||cu;
  const isMgr=['מנהל','מנהלת רכש','מנכלית'].includes(me.role);

  function onCreatePR(items){setPrItems(items);setTab('requests');}

  return h('div',{style:{minHeight:'100vh',fontFamily:'Arial,sans-serif'}},
    h('div',{style:{background:'var(--nv)',color:'#fff',padding:'8px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
      h('div',{style:{fontWeight:500,fontSize:15}},connected===null?'🍯 Negohoney — מתחבר...':connected?'🍯 Negohoney — מערכת רכש':'🍯 Negohoney — מנותק (עובד מקומית)'),
      h('div',{style:{display:'flex',alignItems:'center',gap:11}},
        h('div',{style:{fontSize:12}},h('span',{style:{color:'#93C5FD'}},me.last+' '+me.first),' · ',h(RBdg,{r:me.role})),
        h('button',{onClick:()=>{setCu(null);S.s('ng_ses',null);},style:{background:'rgba(255,255,255,.12)',border:'none',color:'#fff',borderRadius:6,padding:'3px 9px',fontSize:12,cursor:'pointer'}},'יציאה')
      )
    ),
    h('div',{className:'ntabs'},[
      ['requests','📋 בקשות',true],
      ['catalog','📦 קטלוג',isMgr],
      ['suppliers','🏢 ספקים',isMgr],
      ['reports','📊 דוחות',isMgr],
      ['settings','⚙ הגדרות',isMgr],
    ].filter(t=>t[2]).map(([k,l])=>h('button',{key:k,className:'ntab'+(tab===k?' on':''),onClick:()=>setTab(k)},l))),
    tab==='requests'&&h(PRModule,{supp,products:prod,user:me,code:settings.code,initItems:prItems,clearInit:()=>setPrItems(null),connected}),
    tab==='catalog'&&h(Catalog,{products:prod,setProducts:setProd,onCreatePR,canEdit:isMgr}),
    tab==='suppliers'&&h(SuppModule,{supp,setSupp,canEdit:isMgr}),
    tab==='reports'&&h(ReportsModule,{supp}),
    tab==='settings'&&h(SettingsModule,{users,setUsers,settings,setSettings,user:me})
  );
}
ReactDOM.render(h(App),document.getElementById('root'));
})();
</script>


</body></html>
