<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דבש נגוהות — מערכת רכש</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#E8830A;--accent-light:#FEF3E2;--dark:#1C2434;
  --text:#2D2D2D;--muted:#6B7280;--border:#E5E7EB;
  --bg:#F6F7F9;--white:#FFFFFF;
  --success:#059669;--warning:#D97706;--danger:#DC2626;--info:#2563EB;
}
body{font-family:Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);direction:rtl}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--white)}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:52px 44px;width:400px;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,0.07)}
.login-logo{font-size:44px;margin-bottom:10px}
.login-title{font-size:22px;font-weight:700;color:var(--dark);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:36px}
.role-btn{display:block;width:100%;padding:16px 20px;margin-bottom:12px;border:2px solid var(--border);border-radius:10px;background:var(--white);font-family:Arial,sans-serif;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;text-align:right}
.role-btn:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.role-btn .role-desc{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}

/* TOPBAR */
.topbar{background:var(--dark);color:white;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:13px}
.role-badge{background:var(--accent);padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
.logout-btn{color:#9CA3AF;background:none;border:none;cursor:pointer;font-size:12px;font-family:Arial,sans-serif}
.logout-btn:hover{color:white}

/* TABS */
.tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto}
.tab{padding:14px 18px;border:none;border-bottom:3px solid transparent;background:none;font-family:Arial,sans-serif;font-size:14px;color:var(--muted);cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab-badge{background:var(--accent);color:white;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:4px}
.tab-badge-warn{background:var(--warning);color:white;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:4px}

/* CONTENT */
.content{padding:24px;max-width:1280px;margin:0 auto}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--dark)}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:7px;font-family:Arial,sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#C97209}
.btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{background:#047857}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{background:#B91C1C}
.btn-info{background:var(--info);color:white}
.btn-info:hover{background:#1D4ED8}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* TABLE */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--bg);padding:11px 14px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-draft{background:#F3F4F6;color:var(--muted)}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-internal{background:#DBEAFE;color:#1E40AF}
.badge-order{background:#D1FAE5;color:#065F46}
.badge-rejected{background:#FEE2E2;color:#991B1B}
.badge-ok{background:#D1FAE5;color:#065F46}
.badge-low{background:#FEF3C7;color:#92400E}
.badge-zero{background:#FEE2E2;color:#991B1B}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:2}
.modal-title{font-size:17px;font-weight:700;color:var(--dark)}
.modal-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-body{padding:22px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:white}

/* FORM */
.form-row{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-family:Arial,sans-serif;font-size:13px;color:var(--text);background:var(--white);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:76px}

/* APPROVAL BOX */
.approval-box{background:var(--accent-light);border:1px solid #F6C56A;border-radius:10px;padding:18px 20px;margin-top:16px}
.approval-box-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.approval-actions{display:flex;gap:10px;flex-wrap:wrap}

/* INFO BOX */
.info-row{display:flex;gap:0;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:8px}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-label{width:140px;flex-shrink:0;font-size:13px;color:var(--muted)}
.info-val{font-size:13px;color:var(--text)}

/* SETTINGS */
.settings-list{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.settings-item:last-child{border-bottom:none}

/* MISC */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px}
.section-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:12px;margin-top:24px}
.section-title:first-child{margin-top:0}
.alert-bar{border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.alert-warn{background:#FEF3C7;border:1px solid #FCD34D;color:#92400E}
.alert-info{background:#DBEAFE;border:1px solid #93C5FD;color:#1E40AF}
.inv-bar{width:70px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;display:inline-block;vertical-align:middle}
.inv-bar-fill{height:100%;border-radius:3px}
.delivery-section{background:#F0FDF4;border:1px solid #86EFAC;border-radius:10px;padding:16px 18px;margin-top:16px}
.delivery-section-title{font-size:13px;font-weight:700;color:#15803D;margin-bottom:12px}
.delivery-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle-row{display:flex;align-items:center;gap:10px}
.toggle-label{font-size:13px;color:var(--text);flex:1}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#D1D5DB;border-radius:12px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;width:18px;height:18px;right:3px;top:3px;background:white;border-radius:50%;transition:.2s}
input:checked+.slider{background:#059669}
input:checked+.slider:before{transform:translateX(-20px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── STORAGE ──────────────────────────────────────────────────
const K={
  suppliers:'ng4_suppliers',products:'ng4_products',requests:'ng4_requests',
  inventory:'ng4_inventory',paymentTerms:'ng4_pt',deliveryTypes:'ng4_dt',
  users:'ng4_users2',counter:'ng4_counter'
};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function nextId(pfx){const c=ld(K.counter,{});c[pfx]=(c[pfx]||0)+1;sv(K.counter,c);return pfx+'-'+String(c[pfx]).padStart(4,'0')}

function getRole(){return sessionStorage.getItem('ng4_role')||''}
function getUser(){return sessionStorage.getItem('ng4_user')||''}
const isAdmin=()=>getRole()==='מנכ"לית';
function fullName(u){return (u.firstName||u.name||'')+(u.lastName?' '+u.lastName:'')}
const canManage=()=>getRole()==='מנכ"לית'||getRole()==='מנהלת רכש';
// כל משתמש רשום יכול לפתוח בקשת רכש

// ── DEFAULTS ─────────────────────────────────────────────────
(function init(){
  if(!ld(K.paymentTerms,null)) sv(K.paymentTerms,['שוטף + 30','שוטף + 60','שוטף + 90','מזומן','אשראי 45 יום']);
  if(!ld(K.deliveryTypes,null)) sv(K.deliveryTypes,['משלוח עד דלת','איסוף עצמי','שליח חיצוני','הובלה']);
  const _eu=ld(K.users,null);
  if(!_eu||_eu.some(u=>!u.firstName)){
    sv(K.users,[
      {id:'u1',firstName:'אליה',lastName:'פויקטונגר',role:'מנכ"לית'},
      {id:'u2',firstName:'לימור',lastName:'גור זיו',role:'מנהלת רכש'}
    ]);
  }
})();

// ── STATE ────────────────────────────────────────────────────
let S={tab:'requests',modal:null,editing:null};

// ── RENDER ───────────────────────────────────────────────────
function render(){
  const role=getRole();
  if(!role){renderLogin();return}
  renderApp(role);
}

function renderLogin(errMsg){
  document.getElementById('app').innerHTML=`
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">🍯</div>
      <div class="login-title">דבש נגוהות</div>
      <div class="login-sub">מערכת רכש ומלאי</div>
      <div class="form-row" style="text-align:right">
        <label>שם פרטי</label>
        <input id="li-first" placeholder="הקלידי שם פרטי" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('li-last').focus()">
      </div>
      <div class="form-row" style="text-align:right;margin-top:12px">
        <label>שם משפחה</label>
        <input id="li-last" placeholder="הקלידי שם משפחה" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      ${errMsg?`<div style="color:#DC2626;font-size:13px;margin-top:8px;text-align:right">⚠️ ${errMsg}</div>`:''}
      <button class="btn btn-primary" style="width:100%;margin-top:20px;padding:12px" onclick="doLogin()">כניסה למערכת</button>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('li-first')?.focus(),50);
}

function doLogin(){
  const first=(document.getElementById('li-first')?.value||'').trim();
  const last=(document.getElementById('li-last')?.value||'').trim();
  if(!first){renderLogin('יש להזין שם פרטי');return}
  const users=ld(K.users,[]);
  const match=users.find(u=>
    (u.firstName||'').trim()===first &&
    (u.lastName||'').trim()===last
  );
  if(!match){renderLogin('השם לא נמצא במערכת. נסי שנית.');return}
  login(match.role, fullName(match));
}

function login(role,name){
  sessionStorage.setItem('ng4_role',role);
  sessionStorage.setItem('ng4_user',name);
  S.tab='requests';render();
}
function logout(){sessionStorage.removeItem('ng4_role');sessionStorage.removeItem('ng4_user');render()}

function renderApp(role){
  const reqs=ld(K.requests,[]);
  const pending=reqs.filter(r=>r.status==='ממתינה לאישור').length;
  const inv=ld(K.inventory,[]);
  const lowInv=inv.filter(i=>Number(i.qty)<=Number(i.minQty)&&Number(i.minQty)>0).length;

  document.getElementById('app').innerHTML=`
  <div class="topbar">
    <div class="topbar-brand">🍯 דבש נגוהות — מערכת רכש</div>
    <div class="topbar-right">
      <span style="color:#9CA3AF">${getUser()}</span>
      <span class="role-badge">${role}</span>
      <button class="logout-btn" onclick="logout()">יציאה ↩</button>
    </div>
  </div>
  <div class="tabs">
    ${tab('requests','📋 בקשות רכש',pending)}
    ${canManage()?tab('inventory','📦 מלאי',0,lowInv):''}
    ${canManage()?tab('suppliers','🏢 ספקים'):''}
    ${canManage()?tab('products','🗂️ קטלוג'):''}
    ${canManage()?tab('settings','⚙️ הגדרות'):''}
  </div>
  <div class="content">${renderTab(S.tab,role)}</div>
  ${renderModal()}`;
}

function tab(id,label,badge=0,warn=0){
  const b=badge>0?`<span class="tab-badge">${badge}</span>`:warn>0?`<span class="tab-badge-warn">⚠${warn}</span>`:'';
  return `<button class="tab${S.tab===id?' active':''}" onclick="setTab('${id}')">${label}${b}</button>`;
}
function setTab(t){S.tab=t;S.modal=null;render()}

function renderTab(t,role){
  if(t==='requests')return renderRequests(role);
  if(!canManage())return renderRequests(role);
  if(t==='inventory')return renderInventory(role);
  if(t==='suppliers')return renderSuppliers();
  if(t==='products')return renderProducts();
  if(t==='settings')return renderSettings(role);
  return '';
}

// ── STATUS BADGE ─────────────────────────────────────────────
function statusBadge(s){
  const m={'טיוטה':'badge-draft','ממתינה לאישור':'badge-pending','אושר - פנימי':'badge-internal','אושר - הזמנה':'badge-order','נדחה':'badge-rejected'};
  return `<span class="badge ${m[s]||''}">${s}</span>`;
}

// ── REQUESTS ─────────────────────────────────────────────────
function renderRequests(role){
  const reqs=ld(K.requests,[]);
  const order={' ממתינה לאישור':0,'טיוטה':1,'אושר - הזמנה':2,'אושר - פנימי':3,'נדחה':4};
  const sorted=[...reqs].sort((a,b)=>(order[a.status]??5)-(order[b.status]??5));

  const rows=sorted.map(r=>`
    <tr>
      <td><b>${r.id}</b></td>
      <td style="white-space:nowrap">${r.date||''}</td>
      <td><b>${r.productName||''}</b></td>
      <td>${r.qty||''} ${r.unit||''}</td>
      <td>${r.supplierName||'—'}</td>
      <td>${r.totalPrice?'₪'+Number(r.totalPrice).toLocaleString('he-IL'):'—'}</td>
      <td>
        ${statusBadge(r.status)}
        ${(r.status==='אושר - פנימי'||r.status==='אושר - הזמנה')&&r.supplyStatus?`<br><span style="font-size:11px;color:var(--muted);margin-top:3px;display:inline-block">${r.supplyStatus==='סופק במלואו'?'✅':r.supplyStatus==='סופק חלקית'?'⚠️':'⏳'} ${r.supplyStatus}</span>`:''}
        ${(r.status==='אושר - פנימי'||r.status==='אושר - הזמנה')&&r.invoiceReceived?`<br><span style="font-size:11px;color:#059669">🧾 חשבונית התקבלה</span>`:''}
      </td>
      <td>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="viewRequest('${r.id}')">פתח</button>
          ${r.status==='ממתינה לאישור'&&isAdmin()?`
            <button class="btn btn-info btn-sm" onclick="approveReq('${r.id}','internal')">✔ פנימי</button>
            <button class="btn btn-success btn-sm" onclick="approveReq('${r.id}','order')">📦 הזמנה</button>
            <button class="btn btn-danger btn-sm" onclick="rejectReq('${r.id}')">✗</button>`:''}
          ${(r.status==='אושר - פנימי'||r.status==='אושר - הזמנה')?`
            <button class="btn btn-secondary btn-sm" onclick="printDoc('${r.id}')">🖨️</button>`:''}
        </div>
      </td>
    </tr>`).join('');

  return `
  <div class="page-header">
    <div class="page-title">בקשות רכש</div>
    <button class="btn btn-primary" onclick="openModal('new-request')">+ בקשה חדשה</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>מס'</th><th>תאריך</th><th>מוצר</th><th>כמות</th><th>ספק</th><th>סכום</th><th>סטטוס</th><th>פעולות</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="8" class="empty">אין בקשות רכש עדיין. לחצי על "+ בקשה חדשה" כדי להתחיל.</td></tr>`}</tbody>
    </table>
  </div>`;
}

function viewRequest(id){
  S.editing=ld(K.requests,[]).find(r=>r.id===id);
  S.modal='view-request';render();
}

function sendToPending(id){
  const reqs=ld(K.requests,[]);
  const r=reqs.find(x=>x.id===id);
  if(r){r.status='ממתינה לאישור';sv(K.requests,reqs)}
  S.modal=null;render();
}

function approveReq(id,type){
  const reqs=ld(K.requests,[]);
  const r=reqs.find(x=>x.id===id);
  if(r){
    r.status=type==='order'?'אושר - הזמנה':'אושר - פנימי';
    r.approvalType=type;r.approvedBy=getUser();
    r.approvedDate=new Date().toLocaleDateString('he-IL');
    sv(K.requests,reqs);
  }
  S.modal=null;render();
}

function rejectReq(id){
  if(!confirm('לדחות את הבקשה?'))return;
  const reqs=ld(K.requests,[]);
  const r=reqs.find(x=>x.id===id);
  if(r){r.status='נדחה';sv(K.requests,reqs)}
  render();
}

function submitRequest(draft){
  const f=fd('req-form');
  if(!f.productName||!f.qty){alert('יש להזין שם מוצר וכמות');return}
  const supps=ld(K.suppliers,[]);
  const supp=supps.find(s=>s.id===f.supplierId);
  const reqs=ld(K.requests,[]);
  reqs.push({
    id:nextId('PR'),date:new Date().toLocaleDateString('he-IL'),
    productName:f.productName,qty:f.qty,unit:f.unit,
    supplierId:f.supplierId,supplierName:supp?supp.name:'',
    pricePerUnit:f.pricePerUnit,totalPrice:f.totalPrice,
    paymentTerms:f.paymentTerms,deliveryType:f.deliveryType,
    notes:f.notes,requester:getUser(),
    status:draft?'טיוטה':'ממתינה לאישור'
  });
  sv(K.requests,reqs);S.modal=null;render();
}

function saveDeliveryStatus(id){
  const reqs=ld(K.requests,[]);
  const r=reqs.find(x=>x.id===id);
  if(!r)return;
  const sup=document.getElementById('ds-supply');
  const inv=document.getElementById('ds-invoice');
  if(sup!==null)r.supplyStatus=sup.value;
  if(inv!==null)r.invoiceReceived=inv.checked;
  sv(K.requests,reqs);
  // flash feedback
  const btn=document.getElementById('ds-save');
  if(btn){btn.textContent='✓ נשמר';btn.disabled=true;setTimeout(()=>{btn.textContent='שמור עדכון';btn.disabled=false},1500);}
}

function printDoc(id){
  const r=ld(K.requests,[]).find(x=>x.id===id);
  if(!r)return;
  const isOrder=r.approvalType==='order';
  const title=isOrder?`הזמנת רכש מס' ${r.id}`:`רכש - מידע פנימי בקשה מס' ${r.id}`;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8"><title>${title}</title>
  <style>body{font-family:Arial,sans-serif;padding:44px;color:#111;font-size:14px}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:#666;font-size:13px;margin-bottom:28px;border-bottom:2px solid #E8830A;padding-bottom:12px}

// ── INVENTORY ────────────────────────────────────────────────
function renderInventory(){
  const inv=ld(K.inventory,[]);
  const supps=ld(K.suppliers,[]);
  const low=inv.filter(i=>Number(i.qty)<Number(i.minQty)&&Number(i.minQty)>0).length;

  const rows=inv.map(item=>{
    const qty=Number(item.qty)||0,min=Number(item.minQty)||0;
    const ratio=min>0?qty/min:1;
    const sc=qty===0?'badge-zero':ratio<1?'badge-low':'badge-ok';
    const sl=qty===0?'אזל':ratio<1?'נמוך':'תקין';
    const bc=qty===0?'#DC2626':ratio<1?'#D97706':'#059669';
    const bp=Math.min(100,ratio*100);
    const supp=supps.find(s=>s.id===item.supplierId);
    return `<tr>
      <td><b>${item.name}</b></td>
      <td>${item.category||''}</td>
      <td>${qty} ${item.unit||''}</td>
      <td>${min} ${item.unit||''}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="inv-bar"><div class="inv-bar-fill" style="width:${bp}%;background:${bc}"></div></div>
          <span class="badge ${sc}">${sl}</span>
        </div>
      </td>
      <td>${item.location||'—'}</td>
      <td>${supp?supp.name:'—'}</td>
      <td>
        <div style="display:flex;gap:5px">
          <button class="btn btn-secondary btn-sm" onclick="editInv('${item.id}')">ערוך</button>
          <button class="btn btn-primary btn-sm" onclick="openQtyModal('${item.id}')">כמות</button>
          ${ratio<1?`<button class="btn btn-success btn-sm" onclick="orderFromInv('${item.id}')">הזמן ↗</button>`:''}
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-header">
    <div class="page-title">מלאי</div>
    <button class="btn btn-primary" onclick="openModal('new-inventory')">+ פריט חדש</button>
  </div>
  ${low>0?`<div class="alert-bar alert-warn">⚠️ <b>${low} פריטים</b> מתחת לרמת המינימום</div>`:''}
  <div class="table-wrap">
    <table>
      <thead><tr><th>שם פריט</th><th>קטגוריה</th><th>כמות</th><th>מינימום</th><th>סטטוס</th><th>מיקום</th><th>ספק מועדף</th><th>פעולות</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="8" class="empty">אין פריטי מלאי. לחצי "+ פריט חדש" כדי להוסיף.</td></tr>`}</tbody>
    </table>
  </div>`;
}

function editInv(id){S.editing=ld(K.inventory,[]).find(i=>i.id===id);S.modal='new-inventory';render()}

function openQtyModal(id){
  S.editing={_qtyId:id};S.modal='update-qty';render();
}

function orderFromInv(id){
  const inv=ld(K.inventory,[]);
  const item=inv.find(i=>i.id===id);
  const supps=ld(K.suppliers,[]);
  const supp=supps.find(s=>s.id===item.supplierId);
  S.editing={_prefill:true,productName:item.name,unit:item.unit,supplierId:item.supplierId,supplierName:supp?.name||''};
  S.modal='new-request';render();
}

function submitInv(){
  const f=fd('inv-form');
  if(!f.name){alert('יש להזין שם פריט');return}
  const inv=ld(K.inventory,[]);
  if(S.editing&&S.editing.id){
    const i=inv.findIndex(x=>x.id===S.editing.id);
    if(i>=0)inv[i]={...inv[i],...f,qty:Number(f.qty)||0,minQty:Number(f.minQty)||0};
  }else{
    inv.push({id:nextId('INV'),...f,qty:Number(f.qty)||0,minQty:Number(f.minQty)||0,lastUpdated:new Date().toLocaleDateString('he-IL')});
  }
  sv(K.inventory,inv);S.modal=null;render();
}

function submitQty(){
  const f=fd('qty-form');
  const inv=ld(K.inventory,[]);
  const item=inv.find(i=>i.id===S.editing._qtyId);
  if(!item)return;
  const amount=Number(f.amount)||0;
  if(f.action==='set')item.qty=amount;
  else if(f.action==='add')item.qty=(Number(item.qty)||0)+amount;
  else item.qty=Math.max(0,(Number(item.qty)||0)-amount);
  item.lastUpdated=new Date().toLocaleDateString('he-IL');
  sv(K.inventory,inv);S.modal=null;render();
}

function addPt(){const v=document.getElementById('new-pt')?.value.trim();if(!v)return;const a=ld(K.paymentTerms,[]);a.push(v);sv(K.paymentTerms,a);render()}
function delPt(i){const a=ld(K.paymentTerms,[]);a.splice(i,1);sv(K.paymentTerms,a);render()}
function addDt(){const v=document.getElementById('new-dt')?.value.trim();if(!v)return;const a=ld(K.deliveryTypes,[]);a.push(v);sv(K.deliveryTypes,a);render()}
function delDt(i){const a=ld(K.deliveryTypes,[]);a.splice(i,1);sv(K.deliveryTypes,a);render()}
function delUser(id){if(!confirm('להסיר משתמש?'))return;sv(K.users,ld(K.users,[]).filter(u=>u.id!==id));render()}
function submitUser(){
  const f=fd('user-form');if(!f.firstName||!f.role){alert('חובה שם פרטי ותפקיד');return}
  const users=ld(K.users,[]);users.push({id:nextId('USR'),firstName:f.firstName,lastName:f.lastName||'',role:f.role});
  sv(K.users,users);S.modal=null;render();
}

function openModal(name){S.modal=name;S.editing=null;render()}
function closeModal(){S.modal=null;S.editing=null;render()}

  const dtOpts=dt.map(t=>`<option value="${t}"${e.deliveryType===t?' selected':''}>${t}</option>`).join('');

  let title='',body='',footer='';

  // ── New Request ──

          ${canManage()?`<button class="btn btn-success btn-sm" id="ds-save" style="margin-top:10px" onclick="saveDeliveryStatus('${r.id}')">שמור עדכון</button>`:''}
        </div>
        <div style="margin-top:12px"><button class="btn btn-secondary" onclick="printDoc('${r.id}')">🖨️ הדפסת מסמך</button></div>`:''}`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">סגור</button>`;
  }

  // ── New Inventory ──
  else if(S.modal==='new-inventory'){
    const isEdit=!!(e&&e.id);
    title=isEdit?`ערוך פריט — ${e.name}`:'פריט מלאי חדש';
    body=`<form id="inv-form">
      <div class="form-row"><label>שם פריט *</label><input name="name" value="${e.name||''}"></div>
      <div class="form-grid">
        <div class="form-row"><label>קטגוריה</label><input name="category" value="${e.category||''}" placeholder="מדבקות, צנצנות, חומרי גלם..."></div>
        <div class="form-row"><label>יחידת מידה</label><input name="unit" value="${e.unit||''}" placeholder='יח, ק"ג, ליטר...'></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>כמות קיימת</label><input name="qty" type="number" value="${e.qty||0}"></div>
        <div class="form-row"><label>כמות מינימום</label><input name="minQty" type="number" value="${e.minQty||0}"></div>
      </div>
      <div class="form-row"><label>מיקום במחסן</label><input name="location" value="${e.location||''}" placeholder="מדף A3, מחסן ראשי..."></div>
      <div class="form-row"><label>ספק מועדף</label>
        <select name="supplierId"><option value="">— בחר ספק —</option>${suppOpts}</select>
      </div>
    </form>`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="submitInv()">שמור</button>`;
  }

  // ── Update Qty ──
  else if(S.modal==='update-qty'){
    const inv=ld(K.inventory,[]);
    const item=inv.find(i=>i.id===e._qtyId)||{};
    title=`עדכון כמות — ${item.name||''}`;
    body=`<form id="qty-form">
      <div style="background:var(--bg);border-radius:8px;padding:14px;margin-bottom:18px;font-size:13px">
        כמות נוכחית: <b>${item.qty||0} ${item.unit||''}</b>
      </div>
      <div class="form-row"><label>פעולה</label>
        <select name="action" onchange="previewQty(this)">
          <option value="add">הוסף לכמות הקיימת</option>
          <option value="subtract">הפחת מהכמות הקיימת</option>
          <option value="set">הגדר כמות חדשה</option>
        </select>
      </div>
      <div class="form-row"><label>כמות</label>
        <input name="amount" type="number" value="0" id="qty-amount" oninput="previewQty()">
      </div>
      <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:12px 16px;font-size:13px;color:#1E40AF">
        כמות חדשה: <b id="qty-new">${item.qty||0}</b> ${item.unit||''}
      </div>
    </form>`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="submitQty()">עדכן</button>`;
  }

  // ── New Supplier ──
  else if(S.modal==='new-supplier'){
    title=e.name?`ערוך ספק — ${e.name}`:'ספק חדש';
    body=`<form id="sup-form">
      <div class="form-grid">
        <div class="form-row"><label>שם ספק *</label><input name="name" value="${e.name||''}"></div>
        <div class="form-row"><label>ח.פ. / ע.מ.</label><input name="hp" value="${e.hp||''}"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>איש קשר</label><input name="contact" value="${e.contact||''}"></div>
        <div class="form-row"><label>טלפון</label><input name="phone" value="${e.phone||''}" type="tel"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>אימייל</label><input name="email" value="${e.email||''}" type="email"></div>
        <div class="form-row"><label>קטגוריה (מה הוא מספק)</label><input name="category" value="${e.category||''}" placeholder="מדבקות, אריזות, דבש..."></div>
      </div>
      <div class="form-row"><label>תנאי תשלום</label>
        <select name="paymentTerms"><option value="">—</option>${ptOpts}</select>
      </div>
      <div class="form-row"><label>הערות</label><textarea name="notes" placeholder="מידע נוסף על הספק...">${e.notes||''}</textarea></div>
    </form>`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="submitSupp()">שמור</button>`;
  }

  // ── New Product ──
  else if(S.modal==='new-product'){
    title=e.name?`ערוך מוצר — ${e.name}`:'מוצר חדש';
    body=`<form id="prod-form">
      <div class="form-grid">
        <div class="form-row"><label>שם מוצר *</label><input name="name" value="${e.name||''}"></div>
        <div class="form-row"><label>מק"ט</label><input name="sku" value="${e.sku||''}"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>קטגוריה</label><input name="category" value="${e.category||''}" placeholder="חומרי גלם, אריזות, ציוד..."></div>
        <div class="form-row"><label>יחידת מידה</label><input name="unit" value="${e.unit||''}" placeholder='יח, ק"ג...'></div>
      </div>
      <div class="form-row"><label>ספק מועדף</label>
        <select name="supplierId"><option value="">—</option>${suppOpts}</select>
      </div>
      <div class="form-row"><label>הערות / מפרט</label><textarea name="notes" placeholder="תיאור, מפרט טכני...">${e.notes||''}</textarea></div>
    </form>`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="submitProd()">שמור</button>`;
  }

  // ── Add User ──
  else if(S.modal==='add-user'){
    title='הוספת משתמש';
    body=`<form id="user-form">
      <div class="form-grid">
        <div class="form-row"><label>שם פרטי *</label><input name="firstName" placeholder="שם פרטי"></div>
        <div class="form-row"><label>שם משפחה *</label><input name="lastName" placeholder="שם משפחה"></div>
      </div>
      <div class="form-row"><label>תפקיד</label>
        <select name="role">
          <option value="מנהלת רכש">מנהלת רכש</option>
          <option value='מנכ"לית'>מנכ"לית</option>
        </select>
      </div>
    </form>`;
    footer=`<button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn btn-primary" onclick="submitUser()">הוסף</button>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer?`<div class="modal-footer">${footer}</div>`:''}
    </div>
  </div>`;
}

// ── HELPERS ──────────────────────────────────────────────────
function fd(formId){
  const form=document.getElementById(formId);
  if(!form)return{};
  const d={};new FormData(form).forEach((v,k)=>d[k]=v);return d;
}

function calcTotal(){
  const qty=parseFloat(document.getElementById('req-qty')?.value)||0;
  const price=parseFloat(document.getElementById('req-price')?.value)||0;
  const t=document.getElementById('req-total');
  if(t&&qty&&price)t.value=(qty*price).toFixed(2);
}

function previewQty(){
  const form=document.getElementById('qty-form');if(!form)return;
  const inv=ld(K.inventory,[]);
  const item=inv.find(i=>i.id===S.editing?._qtyId)||{};
  const action=form.querySelector('[name=action]')?.value||'add';
  const amount=parseFloat(form.querySelector('[name=amount]')?.value)||0;
  const cur=Number(item.qty)||0;
  let res=cur;
  if(action==='add')res=cur+amount;
  else if(action==='subtract')res=Math.max(0,cur-amount);
  else res=amount;
  const el=document.getElementById('qty-new');
  if(el)el.textContent=res;
}

// ── INIT ─────────────────────────────────────────────────────
render();
</script>
</body>
</html>
